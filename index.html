:root{
  --navy:#16255f; --navy-2:#2b4491;
  --ink:#1d2440; --ink-soft:#5f6b86;
  --bg:#eef2f9; --card:#ffffff;
  --green:#06c755; --green-d:#04a445;
  --edge:#dce3ef;
  --serif:'Hiragino Sans','Hiragino Kaku Gothic ProN','Hiragino Kaku Gothic Pro','Noto Sans JP','Yu Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--serif);
  font-weight:600;
  font-size:18px; line-height:1.9;
  color:var(--ink); background:var(--bg);
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
.sheet{
  max-width:700px; margin:0 auto; background:var(--card);
  min-height:100vh; min-height:100dvh;
  box-shadow:0 0 30px rgba(22,37,95,.09);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ① 期限バー */
.limit{
  position:sticky; top:0; z-index:10;
  background:linear-gradient(180deg,#ff9c46 0%,#f2543d 100%);
  color:#fff; text-align:center;
  padding:10px 14px 11px;
  padding-top:calc(10px + env(safe-area-inset-top));
  box-shadow:0 2px 10px rgba(0,0,0,.14);
}
.limit-l{
  font-size:clamp(11px,3.4vw,15px); font-weight:700;
  letter-spacing:.01em; opacity:.97; white-space:nowrap;
}
.limit-c{
  font-size:clamp(17px,5vw,21px); font-weight:800; margin-top:3px;
  font-variant-numeric:tabular-nums; letter-spacing:.03em; white-space:nowrap;
}
.limit.is-end .limit-l{display:none}
.limit.is-end .limit-c{font-size:17px; font-weight:700}

/* ② タイトル */
.head{text-align:center; padding:34px 20px 30px}
.head h1{
  margin:0; color:var(--navy);
  font-size:clamp(21px,5.9vw,32px);
  font-weight:800; line-height:1.55; letter-spacing:.02em;
}
.head h1 .rec{
  display:block; margin-top:14px;
  font-size:clamp(34px,10vw,52px);
  font-weight:800; letter-spacing:.34em; text-indent:.34em;
  color:var(--navy);
  padding:10px 0 12px;
  border-top:2px solid var(--navy-2); border-bottom:2px solid var(--navy-2);
}

/* ③ 動画 */
.stage{background:#101a36; padding:18px 0 20px}
.frame{max-width:664px; margin:0 auto; padding:0 14px}
.frame-in{
  display:flex; width:100%; aspect-ratio:16/9;
  background:#000; border-radius:8px; overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.42);
}
.frame-in iframe{flex:1 1 auto; align-self:stretch; border:0; display:block}
.stage p{
  margin:14px auto 0; max-width:600px; padding:0 18px;
  color:#c2cde6; font-size:15px; font-weight:700;
  text-align:center; line-height:1.85; letter-spacing:.02em;
}

/* ④ CTA */
.cta-wrap{padding:30px 20px 38px; text-align:center}
.pulse{
  display:block; transform-origin:center center;
  animation:ctaPulse 1.7s ease-in-out infinite;
  will-change:transform;
}
@keyframes ctaPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(var(--pulse,1.045))}
}
.pulse:hover,.pulse:focus-within{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){ .pulse{animation:none} }
.cta{
  display:flex; align-items:center; justify-content:center; gap:14px;
  width:100%; max-width:540px; margin:0 auto;
  min-height:88px; padding:14px 18px;
  background:linear-gradient(180deg,#37d97f 0%,var(--green) 55%,var(--green-d) 100%);
  border:none; border-radius:999px;
  box-shadow:0 5px 0 rgba(4,132,58,.5), 0 14px 28px rgba(6,199,85,.26);
  color:#fff; font-family:var(--serif);
  font-size:clamp(14px,4.1vw,24px); font-weight:800; line-height:1.5; letter-spacing:.01em;
  text-decoration:none; cursor:pointer;
}
.cta:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(4,132,58,.5)}
.cta[disabled]{
  background:linear-gradient(180deg,#ccd5e2 0%,#adb9ca 100%);
  box-shadow:0 4px 0 rgba(120,132,150,.38); cursor:default;
}
.cta .mark{
  flex:0 0 auto; width:52px; height:52px; background:#fff; border-radius:15px;
  display:flex; align-items:center; justify-content:center;
}
.cta[disabled] .mark{background:#eef1f6}
.cta .txt{flex:0 1 auto; min-width:0; text-align:center}
.cta .txt .l{display:block; white-space:nowrap}
.cta .go{flex:0 0 auto; width:33px; height:33px}
.cta-todo{margin:14px 0 0; font-size:15px; font-weight:700; color:#e0492f; letter-spacing:.02em}

/* 公開終了 */
.ended{display:none; padding:34px 20px 10px; text-align:center}
.ended-box{
  max-width:540px; margin:0 auto; background:#f6f8fd;
  border:1px solid var(--edge); border-radius:10px; padding:28px 20px;
}
.ended-box h2{
  margin:0 0 12px; font-size:22px; font-weight:800;
  color:var(--navy); letter-spacing:.06em;
}
.ended-box p{margin:0; font-size:16px; font-weight:600; color:var(--ink-soft); line-height:2}

@media (max-width:360px){
  .pulse{--pulse:1.028}
  .cta{gap:10px; min-height:78px; padding:12px 14px}
  .cta .mark{width:44px; height:44px; border-radius:12px}
  .cta .go{width:27px; height:27px}
  .head{padding:24px 16px 20px}
  .cta-wrap{padding:26px 16px 32px}
}
</style>
</head>

    var f = document.createElement('iframe');
    f.src = CONFIG.VIDEO_URL;
    f.setAttribute('allow','autoplay; fullscreen; picture-in-picture');
    f.setAttribute('allowfullscreen','');
    f.setAttribute('title','セミナー録画');
    frameIn.appendChild(f);
  }

  function toEnded(){
    if (expired) return;
    expired = true;
    stage.style.display = 'none';
    frameIn.innerHTML = '';
    ended.style.display = 'block';
    limit.classList.add('is-end');
    count.textContent = '公開は終了しました';
  }

  function tick(){
    var left = end - Date.now();
    if (left <= 0) { toEnded(); return; }
    var s = Math.floor(left/1000);
    var d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
        m = Math.floor(s%3600/60), ss = s%60;
    var p = function(n){ return (n<10?'0':'')+n; };
    count.textContent = 'あと ' + (d>0 ? d+'日 ' : '') + p(h)+'時間 '+p(m)+'分 '+p(ss)+'秒';
  }

  var cta = document.getElementById('cta');
  var todo = document.getElementById('ctaTodo');
  if (CONFIG.LINE_URL) {
    var a = document.createElement('a');
    a.className = 'cta';
    a.href = CONFIG.LINE_URL;
    a.rel = 'noopener';
    a.innerHTML = cta.innerHTML;
    cta.parentNode.replaceChild(a, cta);
    todo.style.display = 'none';
  }

  if (Date.now() < end) { mountVideo(); tick(); setInterval(tick, 1000); }
  else { toEnded(); }
})();
</script>
</body>
</html>
